<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://codeinoven.com/favicon.ico" sizes="any" />
  <link rel="icon" href="https://codeinoven.com/favicon.png" />
  <meta name="text-scale" content="scale" />
  <!-- Set before first paint so scroll-reveal never flashes, and so the
		     content stays visible when scripting is unavailable. -->
  <script>
    document.documentElement.classList.add('js');
  </script>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
