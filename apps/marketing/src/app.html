<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://codeinoven.com/favicon.ico" sizes="any" />
  <link rel="icon" href="https://codeinoven.com/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="https://codeinoven.com/apple-touch-icon.png" />
  <meta name="text-scale" content="scale" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="application-name" content="CodeInOven" />
  <meta name="apple-mobile-web-app-title" content="CodeInOven" />
  <meta name="theme-color" content="#131418" />
  <!-- Set before first paint so scroll-reveal never flashes, and so the
		     content stays visible when scripting is unavailable. -->
  <script>
    document.documentElement.classList.add('js');
  </script>
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
