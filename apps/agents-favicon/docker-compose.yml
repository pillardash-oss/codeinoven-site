# Local/self-hosted deployment. On Coolify, point a Docker Compose resource
# at this file — the named volume keeps icons + SQLite across redeploys
# (first boot copies the seeded DB baked into the image).
# Build context is the monorepo root; the Dockerfile lives there too.
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile.favicon
    ports:
      - '3000:3000'
    volumes:
      - icons-data:/app/data
    environment:
      # Public origin of the deployment (used by adapter-node).
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      # Optional: raises GitHub API rate limits for the crawler.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: unless-stopped

volumes:
  icons-data:
