# Local/self-hosted deployment for the CodeInOven marketing site.
# On Coolify, point a Docker Compose resource at this file.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.marketing
      args:
        PUBLIC_POSTHOG_TOKEN: ${PUBLIC_POSTHOG_TOKEN:-}
    ports:
      - '8080:3000'
    restart: unless-stopped
